name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-course:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the course
        run: python -m pip install -r requirements.txt

      - name: Check setup
        run: python check_setup.py

      - name: Compile every Python path
        run: python -m compileall -q inference_platform examples hands_on tests check_setup.py

      - name: Run a nonempty test suite
        run: |
          python - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          count = suite.countTestCases()
          print(f"discovered tests: {count}")
          if count == 0:
              raise SystemExit("test discovery found zero tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY

      - name: Run every narrated example
        shell: bash
        run: |
          for example in examples/[0-9][0-9]_*.py; do
            echo "running ${example}"
            python "${example}"
          done

      - name: Run the capstone twice
        shell: bash
        run: |
          python hands_on/plan_fleet.py
          cp fleet-plan.json first-fleet-plan.json
          python hands_on/plan_fleet.py
          cmp first-fleet-plan.json fleet-plan.json
